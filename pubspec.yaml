name: yuruyus_defteri
description: Reklamsiz kisisel adim sayar uygulamasi.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Flutter SDK'nin parcasi (internetten ek paket inmez): tarih secici,
  # takvim ve sistem pencereleri Turkce.
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  pedometer: ^4.0.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  home_widget: ^0.7.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  google_sign_in: ^7.2.0
  # Rota haritasi (OpenStreetMap/CARTO karolari, API anahtari gerekmez)
  flutter_map: ^8.2.0
  latlong2: ^0.9.1
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  confetti: ^0.8.0
  lottie: ^3.6.1
  shimmer: ^4.0.0
  percent_indicator: ^4.2.5
  screenshot: ^3.0.0
  geolocator: ^14.0.3
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.jpg"

flutter:
  uses-material-design: true

