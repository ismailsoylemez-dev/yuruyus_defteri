<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%" font-family="Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1200" height="280" rx="20" fill="#07150D"/>
  <g id="steps">
    <g transform="translate(32,32)">
      <rect width="256" height="216" rx="16" fill="#0D2618" stroke="#22C55E" stroke-opacity="0.35"/>
      <circle cx="38" cy="38" r="18" fill="#22C55E"/><text x="38" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#052E16">1</text>
      <text x="68" y="44" font-size="17" font-weight="700" fill="#FFF">Kaynağı Seç</text>
      <text x="20" y="84" font-size="13.5" fill="#DCFCE7">Ayarlar'dan Health Connect</text>
      <text x="20" y="106" font-size="13.5" fill="#DCFCE7">ya da telefon sensörü seçilir.</text>
      <text x="20" y="128" font-size="13.5" fill="#DCFCE7">İkisi aynı anda aktif olmaz,</text>
      <text x="20" y="150" font-size="13.5" fill="#DCFCE7">geçiş verileri bozmaz.</text>
      <rect x="20" y="170" width="216" height="28" rx="8" fill="#081C10"/><text x="128" y="189" text-anchor="middle" font-family="Segoe UI, Roboto, monospace" font-size="11.5" fill="#86EFAC">step_source_mode.dart</text>
    </g>
    <path d="M296 140 H316 M310 134 L318 140 L310 146" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g transform="translate(324,32)">
      <rect width="256" height="216" rx="16" fill="#0D2618" stroke="#22C55E" stroke-opacity="0.35"/>
      <circle cx="38" cy="38" r="18" fill="#22C55E"/><text x="38" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#052E16">2</text>
      <text x="68" y="44" font-size="17" font-weight="700" fill="#FFF">Arka Planda Say</text>
      <text x="20" y="84" font-size="13.5" fill="#DCFCE7">Kotlin ön plan servisi adımı,</text>
      <text x="20" y="106" font-size="13.5" fill="#DCFCE7">kadansı ve kalıcı bildirimi</text>
      <text x="20" y="128" font-size="13.5" fill="#DCFCE7">yönetir; uygulama kapalıyken</text>
      <text x="20" y="150" font-size="13.5" fill="#DCFCE7">de çalışmaya devam eder.</text>
      <rect x="20" y="170" width="216" height="28" rx="8" fill="#081C10"/><text x="128" y="189" text-anchor="middle" font-family="Segoe UI, Roboto, monospace" font-size="11.5" fill="#86EFAC">StepService.kt (FGS health|location)</text>
    </g>
    <path d="M588 140 H608 M602 134 L610 140 L602 146" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g transform="translate(616,32)">
      <rect width="256" height="216" rx="16" fill="#0D2618" stroke="#22C55E" stroke-opacity="0.35"/>
      <circle cx="38" cy="38" r="18" fill="#22C55E"/><text x="38" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#052E16">3</text>
      <text x="68" y="44" font-size="17" font-weight="700" fill="#FFF">Rotayı Çiz</text>
      <text x="20" y="84" font-size="13.5" fill="#DCFCE7">Yürüyüş algılanınca GPS açılır,</text>
      <text x="20" y="106" font-size="13.5" fill="#DCFCE7">4 dk hareketsizlikte kapanır.</text>
      <text x="20" y="128" font-size="13.5" fill="#DCFCE7">Antrenmanda GPS hep yüksek</text>
      <text x="20" y="150" font-size="13.5" fill="#DCFCE7">doğrulukta, sıçramalar elenir.</text>
      <rect x="20" y="170" width="216" height="28" rx="8" fill="#081C10"/><text x="128" y="189" text-anchor="middle" font-family="Segoe UI, Roboto, monospace" font-size="11.5" fill="#86EFAC">RouteTracker.kt • RouteMath.kt</text>
    </g>
    <path d="M880 140 H900 M894 134 L902 140 L894 146" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g transform="translate(908,32)">
      <rect width="260" height="216" rx="16" fill="#0D2618" stroke="#22C55E" stroke-opacity="0.35"/>
      <circle cx="38" cy="38" r="18" fill="#22C55E"/><text x="38" y="44" text-anchor="middle" font-size="15" font-weight="800" fill="#052E16">4</text>
      <text x="68" y="44" font-size="17" font-weight="700" fill="#FFF">Senkronla &amp; Göster</text>
      <text x="20" y="84" font-size="13.5" fill="#DCFCE7">Gün, saatlik dağılım ve tempo</text>
      <text x="20" y="106" font-size="13.5" fill="#DCFCE7">tek yazıcıyla birleştirilip</text>
      <text x="20" y="128" font-size="13.5" fill="#DCFCE7">Firestore'a yedeklenir; ekranlar</text>
      <text x="20" y="150" font-size="13.5" fill="#DCFCE7">tek önbellekten okur.</text>
      <rect x="20" y="170" width="220" height="28" rx="8" fill="#081C10"/><text x="130" y="189" text-anchor="middle" font-family="Segoe UI, Roboto, monospace" font-size="11.5" fill="#86EFAC">step_sync_service → step_cache</text>
    </g>
